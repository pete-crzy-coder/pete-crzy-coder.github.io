<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You caught it!</title>
    <style>
        body {
            background: #0b0c10;
            color: #e6e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif;
        }

        .card {
            position: relative;
            width: 400px;
            height: 300px;
            background: #151821;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Good job. U caught my sneaky btn.</h1>
        <p>pls support my minecraft server... join with ip (BE or JE):</p>
        <button onclick="copyIP()">203.28.238.130</button>
    </div>

    <script>
        function copyIP() {
            const serverIP = "203.28.238.130";

            // Copies the IP to the clipboard
            navigator.clipboard.writeText(serverIP).then(() => {
                alert("Server IP copied to clipboard!");
            }).catch(err => {
                console.error("Failed to copy: ", err);
            });
        }
    </script>
</body>

</html>
